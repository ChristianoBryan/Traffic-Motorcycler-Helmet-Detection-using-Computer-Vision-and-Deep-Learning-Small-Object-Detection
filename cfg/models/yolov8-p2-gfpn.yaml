# YOLOv8 + P2 + neck bergaya GFPN ("GFPN-lite"). Tahap 4.
# Tiap node neck menerima fitur dari TIGA skala (queen-fusion): hasil upsample level di atasnya,
# fitur backbone level yang sama, dan hasil downsample level di bawahnya. Ini BUKAN reimplementasi
# penuh GFPN DAMO-YOLO (tanpa CSPStage/log2n-link); ini versi ringan dengan blok C2f.
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  # ---- jalur top-down (tiap node: atas + backbone + bawah)
  - [9, 1, Conv, [512, 1, 1]] # 10 lateral P5
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 P5 -> res P4
  - [4, 1, Conv, [256, 3, 2]] # 12 P3 -> res P4
  - [[11, 6, 12], 1, Concat, [1]] # 13
  - [-1, 3, C2f, [512]] # 14 node P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 P4 -> res P3
  - [2, 1, Conv, [128, 3, 2]] # 16 P2 -> res P3
  - [[15, 4, 16], 1, Concat, [1]] # 17
  - [-1, 3, C2f, [256]] # 18 node P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19 P3 -> res P2
  - [[19, 2], 1, Concat, [1]] # 20
  - [-1, 3, C2f, [128]] # 21 node P2 -> OUT P2

  # ---- jalur bottom-up (tiap node: bawah + node top-down + atas)
  - [-1, 1, Conv, [128, 3, 2]] # 22 P2 -> res P3
  - [[22, 18, 15], 1, Concat, [1]] # 23
  - [-1, 3, C2f, [256]] # 24 OUT P3

  - [-1, 1, Conv, [256, 3, 2]] # 25 P3 -> res P4
  - [[25, 14, 11], 1, Concat, [1]] # 26
  - [-1, 3, C2f, [512]] # 27 OUT P4

  - [-1, 1, Conv, [512, 3, 2]] # 28 P4 -> res P5
  - [[28, 10], 1, Concat, [1]] # 29
  - [-1, 3, C2f, [1024]] # 30 OUT P5

  - [[21, 24, 27, 30], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
